name: Checks

# Gates every pull request, and every publish (publish.yml calls this workflow
# before it pushes an image): typecheck, unit tests, and the e2e suite against
# the production image and a seeded sandbox Jellyfin.
on:
  pull_request:
  workflow_call:

jobs:
  # Correctness gate: typecheck + unit tests must be green before the image is
  # built or pushed, so we can never publish a known-broken build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Unit tests
        run: npm test

  # Behavior gate: builds the production image from this checkout and runs the
  # full e2e flow suite (e2e/run.mjs, every flow) against it, behind the
  # self-host proxy, with a freshly-bootstrapped sandbox Jellyfin. The steps
  # are the ones docker-compose.e2e.yml documents for local runs.
  # Parallel to `test` rather than folded into it: `test` stays fast/cheap (no
  # Docker, no Jellyfin) so a quick regression shows up fast, and the two
  # failure signals (unit-test break vs. flow break) stay easy to tell apart.
  e2e:
    runs-on: ubuntu-latest
    # Initial tunable value, not a measured permanent constant: covers sandbox
    # bootstrap, the image build, and all sequential Playwright flows.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Provisioning talks to Jellyfin directly, before the app exists.
      - name: Boot sandbox Jellyfin
        run: ./scripts/e2e.sh up -d jellyfin-sandbox

      - name: Generate sandbox fixtures
        run: ./scripts/e2e.sh run --rm sandbox-generate

      # Runs the Jellyfin first-run wizard, creates users/libraries, mints an
      # API key, and emits .env.sbx + config.sbx.json, which the app and proof
      # need.
      - name: Provision sandbox Jellyfin
        run: ./scripts/e2e.sh run --rm sandbox-provision

      - name: Reset sandbox played-state
        run: ./scripts/e2e.sh run --rm sandbox-reset

      # --wait returns once the app's healthcheck passes, or fails.
      - name: Build and start the stack
        run: ./scripts/e2e.sh up -d --build --wait

      # A flow's fail() calls process.exit(1), so a broken flow fails this step.
      - name: Run e2e flow suite
        run: ./scripts/e2e.sh run --rm -e PROOF_FLOW=all proof

      - name: App logs on failure
        if: failure()
        run: ./scripts/e2e.sh logs gogglebox

      # Screenshots from a broken CI run, inspectable from the Actions UI.
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: ./artifacts/**
          if-no-files-found: ignore

      - name: Tear down sandbox stack
        if: always()
        run: ./scripts/e2e.sh down -v --remove-orphans
