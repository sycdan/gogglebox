# Self-host Gogglebox from this folder: copy it to the host, copy .env.example
# to .env and config.example.json to config.json, fill both in, then
#
#   docker compose up -d -y
#
# The stack itself (docker-compose.base.yml in the Gogglebox repo) is pulled
# for the GOGGLEBOX_VERSION set in .env, so upgrading is changing that version.
# -y accepts Compose's prompt to confirm variables for a remote stack.
include:
  - oci://ghcr.io/sycdan/gogglebox-compose:${GOGGLEBOX_VERSION:?pin a version in .env}

services:
  gogglebox:
    volumes:
      - ./config.json:/app/config.json:ro
